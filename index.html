<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Heladería POS Pro v7.11</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background-color: #f2f2f7; user-select: none; -webkit-tap-highlight-color: transparent; }
        .apple-card { background: white; border-radius: 22px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .btn-press:active { transform: scale(0.96); background-color: #e5e5ea; }
        .modal-bg { background-color: rgba(0,0,0,0.6); backdrop-filter: blur(8px); }
        .counter-btn { width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; background: #f3f4f6; border-radius: 10px; font-weight: bold; }
        .scroll-beauty::-webkit-scrollbar { width: 4px; }
        .scroll-beauty::-webkit-scrollbar-thumb { background: #d1d1d6; border-radius: 10px; }
        
        /* Estilo compacto para que quepa todo el inventario */
        .inv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .inv-box { background: #f9f9fb; padding: 10px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #eee; }
    </style>
</head>
<body class="p-4 pb-28 text-gray-800">
    <div class="max-w-md mx-auto">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-black tracking-tight text-gray-900">Heladería 🍦</h1>
            <div class="flex gap-2">
                <button onclick="abrirHistorialDias()" class="bg-white p-3 rounded-full shadow-sm btn-press border text-xl">📅</button>
                <button onclick="abrirBitacora()" class="bg-white p-3 rounded-full shadow-sm btn-press border text-xl">📜</button>
                <button onclick="abrirAjustes()" class="bg-white p-3 rounded-full shadow-sm btn-press border text-xl">⚙️</button>
            </div>
        </header>

        <!-- PANTALLA TOTAL -->
        <div class="apple-card p-8 mb-6 text-center border-b-4 border-blue-500">
            <span class="text-gray-400 text-[10px] font-black uppercase tracking-[0.2em] block mb-2">Total de la Venta</span>
            <div id="displayTotal" class="text-6xl font-black my-2 text-gray-900 tracking-tighter">$0.00</div>
            <div id="displayLista" class="text-gray-400 text-xs font-medium h-4 truncate italic">Esperando productos...</div>
            
            <div class="flex justify-center gap-2 mt-4">
                <button onclick="aplicarDescuento(0)" id="dto0" class="text-[10px] bg-blue-600 text-white px-3 py-1.5 rounded-full font-bold shadow-sm">Normal</button>
                <button onclick="aplicarDescuento(5)" id="dto5" class="text-[10px] bg-gray-100 text-gray-400 px-3 py-1.5 rounded-full font-bold">-5%</button>
                <button onclick="aplicarDescuento(10)" id="dto10" class="text-[10px] bg-gray-100 text-gray-400 px-3 py-1.5 rounded-full font-bold">-10%</button>
            </div>

            <div class="grid grid-cols-2 gap-4 mt-6">
                <button onclick="abrirPago()" class="bg-green-500 text-white font-black py-5 rounded-[20px] btn-press shadow-lg shadow-green-200 text-lg uppercase tracking-widest">Cobrar</button>
                <button onclick="borrarUltimo()" class="bg-gray-100 text-gray-500 font-bold py-5 rounded-[20px] btn-press text-2xl">←</button>
            </div>
        </div>

        <!-- PRODUCTOS -->
        <div class="grid grid-cols-2 gap-3 mb-6">
            <script>
                const productos = [
                    {n:'Vainilla 4oz', id:'V4', p:35, c:'blue-300'}, {n:'Choco 4oz', id:'C4', p:35, c:'orange-700'},
                    {n:'Vainilla 6oz', id:'V6', p:45, c:'blue-400'}, {n:'Choco 6oz', id:'C6', p:45, c:'orange-800'},
                    {n:'Vainilla 8oz', id:'V8', p:60, c:'blue-500'}, {n:'Choco 8oz', id:'C8', p:60, c:'orange-900'},
                    {n:'Vainilla 16oz', id:'V16', p:110, c:'blue-600'}, {n:'Choco 16oz', id:'C16', p:130, c:'orange-950'},
                    {n:'Vainilla 32oz', id:'V32', p:200, c:'blue-800'}, {n:'Choco 32oz', id:'C32', p:230, c:'black'}
                ];
                productos.forEach(p => {
                    document.write(`<button onclick="add('${p.id}', ${p.p})" class="apple-card p-4 btn-press text-left border-l-8 border-${p.c}"><div class="text-${p.c} font-black text-[9px] uppercase">${p.n}</div><div class="text-xl font-black">$${p.p}</div></button>`);
                });
            </script>
            <button onclick="abrirVentaLibre()" class="col-span-2 bg-gray-900 text-white p-5 rounded-[22px] btn-press flex justify-between items-center shadow-xl mt-2">
                <span class="font-black text-xs uppercase tracking-widest">➕ Venta Improvisada</span>
            </button>
        </div>

        <div id="gridPromos" class="grid grid-cols-1 gap-3"></div>
        <button onclick="abrirResumen()" class="fixed bottom-6 left-6 right-6 bg-blue-600 text-white py-5 rounded-[22px] font-black text-lg shadow-2xl btn-press z-10 uppercase tracking-widest">Ver Resumen Hoy</button>
    </div>

    <!-- MODAL RESUMEN (OPTIMIZADO) -->
    <div id="modalResumen" class="fixed inset-0 modal-bg hidden items-center justify-center z-50 p-4">
        <div class="bg-white w-full max-w-sm rounded-[35px] shadow-2xl flex flex-col max-h-[90vh]">
            <div class="p-6 pb-2 text-center relative border-b">
                <h3 class="text-xl font-black">Resumen del Día</h3>
                <button onclick="cerrarModal('modalResumen')" class="absolute top-4 right-6 text-gray-300 text-2xl">×</button>
            </div>
            
            <div id="resumenContent" class="flex-1 overflow-y-auto p-5 scroll-beauty">
                <!-- Se llena por JS -->
            </div>
            
            <div class="p-6 bg-white border-t rounded-b-[35px]">
                <div class="flex justify-between items-center mb-4 px-2">
                    <button onclick="cambiarPagina(-1)" class="bg-gray-100 p-4 rounded-full font-black">←</button>
                    <span id="pagiLabel" class="font-black text-gray-300 text-[10px] uppercase">Pág 1 / 5</span>
                    <button onclick="cambiarPagina(1)" class="bg-gray-100 p-4 rounded-full font-black">→</button>
                </div>
                <button onclick="abrirConfirmReset()" class="w-full py-4 border-2 border-red-500 text-red-600 font-black rounded-2xl uppercase text-sm tracking-tighter btn-press">
                    Cerrar Caja y Guardar Día
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL VENTA LIBRE -->
    <div id="modalVentaLibre" class="fixed inset-0 modal-bg hidden items-center justify-center z-50 p-4">
        <div class="bg-white w-full max-w-sm rounded-[35px] shadow-2xl flex flex-col max-h-[85vh]">
            <div class="p-6 text-center border-b"><h3 class="text-xl font-black">Venta Especial</h3></div>
            <div id="contenedorContadores" class="flex-1 overflow-y-auto p-6 space-y-2 scroll-beauty"></div>
            <div class="p-6 pt-4 border-t bg-gray-50 rounded-b-[35px]">
                <input id="libMonto" type="number" placeholder="Precio $" class="w-full p-4 bg-white text-blue-600 font-black rounded-2xl border-0 shadow-inner text-center text-2xl mb-3">
                <button onclick="confirmarVentaLibre()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black btn-press shadow-lg">Confirmar</button>
                <button onclick="cerrarModal('modalVentaLibre')" class="w-full py-3 text-red-600 font-black mt-1 uppercase text-[10px] tracking-widest text-center">CANCELAR</button>
            </div>
        </div>
    </div>

    <!-- AJUSTES -->
    <div id="modalAjustes" class="fixed inset-0 modal-bg hidden items-center justify-center z-50 p-4">
        <div class="bg-white w-full max-w-sm rounded-[30px] p-6 max-h-[85vh] overflow-y-auto shadow-2xl scroll-beauty flex flex-col">
            <h3 class="text-xl font-black mb-4 text-center">Ajustes</h3>
            <div class="bg-blue-50 p-4 rounded-[20px] mb-4">
                <input id="pNom" type="text" placeholder="Nombre" class="w-full p-3 rounded-xl mb-2 font-bold border-0 text-sm">
                <input id="pPre" type="number" placeholder="Precio $" class="w-full p-3 rounded-xl mb-4 font-bold border-0 text-sm">
                <div id="contadoresPromo" class="grid grid-cols-2 gap-2 mb-4"></div>
                <button onclick="guardarNuevaPromo()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-black">Crear Botón</button>
            </div>
            <div id="listaPromosGestion" class="space-y-1 mb-4"></div>
            <button onclick="cerrarModal('modalAjustes')" class="w-full py-2 text-red-600 font-black uppercase text-[10px] text-center">CERRAR</button>
        </div>
    </div>

    <script>
        const tipos = ['V4','C4','V6','C6','V8','C8','V16','C16','V32','C32'];
        let carrito = []; let pagActual = 0; let descuentoPct = 0;
        let seleccionLibre = {}; let recetaPromoNueva = {};
        tipos.forEach(t => { seleccionLibre[t] = 0; recetaPromoNueva[t] = 0; });

        let db = JSON.parse(localStorage.getItem('heladeria_v7_final')) || {
            inv: {}, promo: {}, term: {}, dinero: { efec:0, term:0, tran:0 }, bitacora: [], promosConfig: [], reportesPasados: []
        };
        tipos.forEach(t => { if (!db.inv[t]) db.inv[t] = 0; if (!db.promo[t]) db.promo[t] = 0; if (!db.term[t]) db.term[t] = 0; });

        function renderContadores() {
            const cL = document.getElementById('contenedorContadores');
            const cP = document.getElementById('contadoresPromo');
            if(!cL || !cP) return;
            cL.innerHTML = ""; cP.innerHTML = "";
            tipos.forEach(t => {
                cL.innerHTML += `<div class="flex items-center justify-between bg-gray-50 p-3 rounded-xl"><span class="font-bold text-sm">${t}</span><div class="flex items-center gap-4"><button onclick="cambiarLibre('${t}', -1)" class="counter-btn text-gray-300">-</button><span id="libCount${t}" class="font-black text-sm">0</span><button onclick="cambiarLibre('${t}', 1)" class="counter-btn text-blue-500">+</button></div></div>`;
                cP.innerHTML += `<div class="bg-white p-2 rounded-xl border flex items-center justify-between"><span class="text-[9px] font-black text-gray-400">${t}</span><div class="flex items-center gap-2"><button onclick="cambiarRecetaPromo('${t}',-1)">-</button><span id="receta${t}" class="text-xs">0</span><button onclick="cambiarRecetaPromo('${t}',1)" class="text-blue-500">+</button></div></div>`;
            });
        }

        function abrirVentaLibre() { 
            renderContadores(); // SE DIBUJAN AL INSTANTE
            tipos.forEach(t => { seleccionLibre[t]=0; if(document.getElementById('libCount'+t)) document.getElementById('libCount'+t).innerText=0; });
            document.getElementById('libMonto').value=""; document.getElementById('modalVentaLibre').style.display='flex'; 
        }

        function add(tipo, precio, receta = null) { carrito.push({ tipo, precio: Number(precio), receta }); actualizarUI(); }
        function actualizarUI() {
            let base = carrito.reduce((a, b) => a + Number(b.precio), 0);
            let total = base - (base * descuentoPct / 100);
            document.getElementById('displayTotal').innerText = `$${total.toFixed(2)}`;
            document.getElementById('displayLista').innerText = (carrito.length > 0 ? carrito.map(i => i.tipo).join(' + ') : "Esperando...");
        }

        function finalizar(metodo) {
            let base = carrito.reduce((a, b) => a + Number(b.precio), 0);
            let totalV = base - (base * descuentoPct / 100);
            if(metodo === 'Efectivo') db.dinero.efec += totalV; else if(metodo === 'Terminal') db.dinero.term += totalV; else db.dinero.tran += totalV;
            carrito.forEach(item => {
                if(db.inv.hasOwnProperty(item.tipo)) { db.inv[item.tipo]++; if(metodo === 'Terminal') db.term[item.tipo]++; }
                if(item.receta) { for(let h in item.receta) { let c = item.receta[h]; db.inv[h] += c; db.promo[h] += c; if(metodo === 'Terminal') db.term[h] += c; } }
            });
            db.bitacora.push({ hora: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), monto: totalV, metodo, detalle: carrito.map(i=>i.tipo).join(',') });
            guardarDB(); carrito = []; descuentoPct = 0; actualizarUI(); cerrarModal('modalPago');
        }

        function renderResumen() {
            const cont = document.getElementById('resumenContent');
            document.getElementById('pagiLabel').innerText = "Pág " + (pagActual + 1) + " / 5";
            let h = "";
            if(pagActual === 0) {
                h = "<h4 class='text-[10px] font-bold text-blue-400 uppercase text-center mb-3 tracking-widest'>Inventario Hoy</h4><div class='inv-grid'>";
                tipos.forEach(t => { h += `<div class='inv-box'><span class='text-xs font-bold text-gray-400'>${t}</span><span class='font-black text-base text-gray-800'>${db.inv[t] || 0}</span></div>`; });
                h += "</div>";
            } else if(pagActual === 1) {
                h = "<h4 class='text-[10px] font-bold text-purple-400 uppercase text-center mb-3 tracking-widest'>En Promoción</h4><div class='inv-grid'>";
                tipos.forEach(t => { h += `<div class='inv-box'><span class='text-xs font-bold text-gray-400'>P-${t}</span><span class='font-black text-base text-purple-600'>${db.promo[t] || 0}</span></div>`; });
                h += "</div>";
            } else if(pagActual === 2) {
                h = "<h4 class='text-[10px] font-bold text-orange-400 uppercase text-center mb-3 tracking-widest'>Tarjeta</h4><div class='inv-grid'>";
                tipos.forEach(t => { h += `<div class='inv-box'><span class='text-xs font-bold text-gray-400'>T-${t}</span><span class='font-black text-base text-orange-600'>${db.term[t] || 0}</span></div>`; });
                h += "</div>";
            } else if(pagActual === 3) h = "<div class='text-center py-6'><h4 class='text-[10px] font-bold text-green-400 uppercase mb-4 tracking-widest'>Caja Bruta</h4><p class='text-3xl font-black mb-2 text-gray-800'>Efectivo: <span class='text-green-600'>$"+db.dinero.efec.toFixed(2)+"</span></p><p class='text-3xl font-black text-gray-800'>Tarjeta: <span class='text-blue-600'>$"+db.dinero.term.toFixed(2)+"</span></p></div>";
            else h = "<div class='text-center py-8'><h4 class='text-[10px] font-bold text-red-400 uppercase mb-4 tracking-widest'>Neto Final</h4><p class='text-5xl font-black text-green-600'>$"+(db.dinero.efec + db.dinero.term + db.dinero.tran - (db.dinero.term * 0.04176)).toFixed(2)+"</p></div>";
            cont.innerHTML = h;
        }

        function guardarDB() { localStorage.setItem('heladeria_v7_final', JSON.stringify(db)); }
        function cerrarModal(id) { document.getElementById(id).style.display = 'none'; }
        function cambiarPagina(d) { pagActual = Math.max(0, Math.min(4, pagActual + d)); renderResumen(); }
        function abrirResumen() { pagActual = 0; document.getElementById('modalResumen').style.display = 'flex'; renderResumen(); }
        function abrirAjustes() { document.getElementById('modalAjustes').style.display = 'flex'; renderListaGestion(); renderContadores(); }
        function cambiarLibre(t, c) { seleccionLibre[t] = Math.max(0, seleccionLibre[t] + c); if(document.getElementById('libCount'+t)) document.getElementById('libCount'+t).innerText = seleccionLibre[t]; }
        function cambiarRecetaPromo(t, c) { recetaPromoNueva[t] = Math.max(0, recetaPromoNueva[t] + c); document.getElementById('receta'+t).innerText = recetaPromoNueva[t]; }
        function confirmarVentaLibre() { const m = parseFloat(document.getElementById('libMonto').value); if(!m) return; add("Especial", m, {...seleccionLibre}); cerrarModal('modalVentaLibre'); }
        function abrirConfirmReset() { if(confirm("¿Cerrar día?")){ db.reportesPasados.push({fecha: new Date().toLocaleDateString(), total: (db.dinero.efec+db.dinero.term+db.dinero.tran)}); db.inv={}; db.promo={}; db.term={}; db.dinero={efec:0,term:0,tran:0}; db.bitacora=[]; guardarDB(); location.reload(); } }
        function aplicarDescuento(p) { descuentoPct = p; actualizarUI(); }
        function borrarUltimo() { carrito.pop(); actualizarUI(); }
        function abrirBitacora() { document.getElementById('modalBitacora').style.display = 'flex'; const cont = document.getElementById('listaBitacora'); cont.innerHTML = ""; [...db.bitacora].reverse().forEach((v) => { cont.innerHTML += `<div class="apple-card p-4 border-l-8 border-blue-500 mb-1 text-sm"><b>${v.hora} - $${v.monto.toFixed(2)}</b><br><small>${v.detalle}</small></div>`; }); }
        function abrirHistorialDias() { document.getElementById('modalHistorialDias').style.display = 'flex'; const cont = document.getElementById('listaDias'); cont.innerHTML = ""; db.reportesPasados.slice().reverse().forEach(r => { cont.innerHTML += `<div class="bg-gray-100 p-4 rounded-xl mb-1 text-xs"><b>${r.fecha}</b> - $${r.total.toFixed(2)}</div>`; }); }
        function abrirPago() { if(carrito.length > 0) document.getElementById('modalPago').style.display = 'flex'; }
        function guardarNuevaPromo() { let n = document.getElementById('pNom').value; let p = document.getElementById('pPre').value; if(n && p) { db.promosConfig.push({ nombre: n, precio: Number(p), receta: {...recetaPromoNueva} }); tipos.forEach(t => recetaPromoNueva[t] = 0); guardarDB(); renderPromosMain(); renderListaGestion(); renderContadores(); document.getElementById('pNom').value = ""; document.getElementById('pPre').value = ""; } }
        function renderPromosMain() { const g = document.getElementById('gridPromos'); g.innerHTML = ""; db.promosConfig.forEach((p, idx) => { g.innerHTML += `<button onclick="add('${p.nombre}', ${p.precio}, ${JSON.stringify(p.receta).replace(/"/g, '&quot;')})" class="apple-card p-5 flex justify-between items-center btn-press border-l-8 border-blue-600 shadow-sm"><span class="font-black text-sm text-gray-700">${p.nombre}</span><b class="text-blue-600 text-xl font-black">$${Number(p.precio).toFixed(2)}</b></button>`; }); }
        function renderListaGestion() { const l = document.getElementById('listaPromosGestion'); l.innerHTML = ""; db.promosConfig.forEach((p, i) => { l.innerHTML += `<div class="flex justify-between items-center bg-gray-50 p-3 rounded-xl mb-1 text-xs"><span>${p.nombre}</span><button onclick="db.promosConfig.splice(${i},1);guardarDB();renderPromosMain();renderListaGestion();" class="text-red-500 font-black">Eliminar</button></div>`; }); }

        renderPromosMain();
    </script>

    <!-- OTROS MODALES -->
    <div id="modalPago" class="fixed inset-0 modal-bg hidden items-end justify-center z-50"><div class="bg-white w-full max-w-md rounded-t-[40px] p-10"><h3 class="text-2xl font-black mb-8 text-center">Forma de Pago</h3><div class="space-y-4"><button onclick="finalizar('Efectivo')" class="w-full py-6 bg-gray-50 rounded-2xl font-black text-xl text-left px-12">💵 Efectivo</button><button onclick="finalizar('Terminal')" class="w-full py-6 bg-gray-50 rounded-2xl font-black text-xl text-left px-12 text-blue-600 border-l-8 border-blue-500">💳 Terminal</button><button onclick="finalizar('Transferencia')" class="w-full py-6 bg-gray-50 rounded-2xl font-black text-xl text-left px-12">🏦 Transferencia</button><button onclick="cerrarModal('modalPago')" class="w-full py-4 text-red-500 font-black mt-2 text-center uppercase">Cancelar</button></div></div></div>
    <div id="modalBitacora" class="fixed inset-0 modal-bg hidden items-center justify-center z-50 p-4"><div class="bg-white w-full max-w-sm rounded-[30px] p-8 h-[80vh] flex flex-col shadow-2xl"><h3 class="text-2xl font-black mb-4 text-center">Ventas de Hoy</h3><div id="listaBitacora" class="flex-1 overflow-y-auto space-y-3 scroll-beauty"></div><button onclick="cerrarModal('modalBitacora')" class="w-full bg-gray-100 py-4 rounded-2xl font-black mt-4">Cerrar</button></div></div>
    <div id="modalHistorialDias" class="fixed inset-0 modal-bg hidden items-center justify-center z-50 p-4"><div class="bg-white w-full max-w-sm rounded-[30px] p-8 h-[70vh] flex flex-col shadow-2xl"><h3 class="text-2xl font-black mb-6 text-center">Días Pasados</h3><div id="listaDias" class="flex-1 overflow-y-auto space-y-3 scroll-beauty"></div><button onclick="cerrarModal('modalHistorialDias')" class="w-full bg-gray-100 py-4 rounded-2xl font-black mt-4">Cerrar</button></div></div>
</body>
</html>
