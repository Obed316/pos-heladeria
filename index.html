<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Heladería POS v9.0 Sincro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background-color: #f2f2f7; user-select: none; -webkit-tap-highlight-color: transparent; }
        .apple-card { background: white; border-radius: 22px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .btn-press:active { transform: scale(0.96); background-color: #e5e5ea; }
        .modal-bg { background-color: rgba(0,0,0,0.6); backdrop-filter: blur(8px); }
        .counter-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #f3f4f6; border-radius: 12px; font-weight: bold; }
        .scroll-beauty::-webkit-scrollbar { width: 4px; }
        .scroll-beauty::-webkit-scrollbar-thumb { background: #d1d1d6; border-radius: 10px; }
        .inv-item { font-size: 1.1rem !important; font-weight: 800 !important; line-height: 1.2; }
        #status-cloud { font-size: 10px; font-weight: bold; text-transform: uppercase; }
    </style>
</head>
<body class="p-4 pb-28 text-gray-800">
    <div class="max-w-md mx-auto">
        <header class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-black tracking-tight text-gray-900">Heladería v9.0</h1>
                <div id="status-cloud" class="text-blue-500">Iniciando...</div>
            </div>
            <div class="flex gap-2">
                <button onclick="abrirHistorialDias()" class="bg-white p-3 rounded-full shadow-sm btn-press border text-xl">📅</button>
                <button onclick="abrirBitacora()" class="bg-white p-3 rounded-full shadow-sm btn-press border text-xl">📜</button>
                <button onclick="abrirAjustes()" class="bg-white p-3 rounded-full shadow-sm btn-press border text-xl">⚙️</button>
            </div>
        </header>

        <!-- PANTALLA TOTAL -->
        <div class="apple-card p-8 mb-6 text-center border-b-4 border-blue-500">
            <span class="text-gray-400 text-[10px] font-black uppercase tracking-[0.2em] block mb-2">Total de la Venta</span>
            <div id="displayTotal" class="text-6xl font-black my-2 text-gray-900 tracking-tighter">$0.00</div>
            <div id="displayLista" class="text-gray-400 text-xs font-medium h-4 truncate italic">Esperando productos...</div>
            
            <div class="flex justify-center gap-2 mt-4">
                <button onclick="aplicarDescuento(0)" id="dto0" class="text-[10px] bg-blue-600 text-white px-3 py-1.5 rounded-full font-bold shadow-sm">Normal</button>
                <button onclick="aplicarDescuento(5)" id="dto5" class="text-[10px] bg-gray-100 text-gray-400 px-3 py-1.5 rounded-full font-bold">-5%</button>
                <button onclick="aplicarDescuento(10)" id="dto10" class="text-[10px] bg-gray-100 text-gray-400 px-3 py-1.5 rounded-full font-bold">-10%</button>
            </div>

            <div class="grid grid-cols-2 gap-4 mt-6">
                <button onclick="abrirPago()" class="bg-green-500 text-white font-black py-5 rounded-[20px] btn-press shadow-lg shadow-green-200 text-lg uppercase tracking-widest">Cobrar</button>
                <button onclick="borrarUltimo()" class="bg-gray-100 text-gray-500 font-bold py-5 rounded-[20px] btn-press text-2xl">←</button>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-6" id="gridMainProductos"></div>
        <div id="gridPromos" class="grid grid-cols-1 gap-3 mb-6"></div>
        
        <button onclick="abrirVentaLibre()" class="w-full bg-gray-900 text-white p-5 rounded-[22px] btn-press flex justify-between items-center shadow-xl mb-4">
            <span class="font-black text-xs uppercase tracking-widest">➕ Venta Improvisada</span>
        </button>

        <button onclick="abrirResumen()" class="fixed bottom-6 left-6 right-6 bg-blue-600 text-white py-5 rounded-[22px] font-black text-lg shadow-2xl btn-press z-10 uppercase tracking-widest">Ver Resumen Hoy</button>
    </div>

    <!-- MODALES (Se mantienen igual para no afectar diseño) -->
    <div id="modalResumen" class="fixed inset-0 modal-bg hidden items-center justify-center z-50 p-4">
        <div class="bg-white w-full max-w-sm rounded-[35px] shadow-2xl relative flex flex-col max-h-[85vh] overflow-hidden text-center">
            <button onclick="cerrarModal('modalResumen')" class="absolute top-4 right-6 text-gray-300 text-3xl z-10">×</button>
            <div id="resumenContent" class="flex-1 overflow-y-auto px-4 pt-10 pb-4 scroll-beauty"></div>
            <div class="p-6 bg-gray-50 border-t rounded-b-[35px]">
                <div class="flex justify-between items-center mb-4 px-4">
                    <button onclick="cambiarPagina(-1)" class="bg-white shadow-sm p-3 rounded-full font-black text-xl btn-press">←</button>
                    <span id="pagiLabel" class="font-black text-gray-400 text-[10px] uppercase">Pág 1 / 5</span>
                    <button onclick="cambiarPagina(1)" class="bg-white shadow-sm p-3 rounded-full font-black text-xl btn-press">→</button>
                </div>
                <button onclick="abrirConfirmReset()" class="w-full py-4 border-2 border-red-500 text-red-600 font-extrabold rounded-2xl uppercase text-base tracking-tighter btn-press">Cerrar Caja y Guardar Día</button>
            </div>
        </div>
    </div>

    <div id="modalAjustes" class="fixed inset-0 modal-bg hidden items-center justify-center z-50 p-4">
        <div class="bg-white w-full max-w-sm rounded-[30px] p-8 max-h-[85vh] overflow-y-auto shadow-2xl flex flex-col">
            <h3 class="text-2xl font-black mb-6 text-center text-gray-800">Ajustes</h3>
            <div class="bg-blue-50 p-5 rounded-[25px] mb-6 shadow-inner text-center">
                <input id="pNom" type="text" placeholder="Nombre de Botón" class="w-full p-4 rounded-xl mb-2 font-bold border-0 shadow-sm text-sm">
                <input id="pPre" type="number" placeholder="Precio $" class="w-full p-4 rounded-xl mb-4 font-bold border-0 shadow-sm text-sm">
                <p class="text-[10px] font-black text-gray-800 uppercase mb-3 tracking-widest">Receta</p>
                <div id="contadoresPromo" class="grid grid-cols-2 gap-2 mb-6"></div>
                <button onclick="guardarNuevaPromo()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-black btn-press shadow-lg">Crear Botón</button>
            </div>
            <div id="listaPromosGestion" class="space-y-2 mb-6 px-1"></div>
            <button onclick="cerrarModal('modalAjustes')" class="w-full py-4 text-red-600 font-black uppercase text-xs text-center">Cerrar Ajustes</button>
        </div>
    </div>

    <div id="modalBitacora" class="fixed inset-0 modal-bg hidden items-center justify-center z-50 p-4 text-center">
        <div class="bg-white w-full max-w-sm rounded-[30px] p-8 h-[80vh] flex flex-col shadow-2xl">
            <h3 class="text-2xl font-black mb-4 text-gray-800 border-b pb-2">Ventas de Hoy</h3>
            <div id="listaBitacora" class="flex-1 overflow-y-auto space-y-3 scroll-beauty px-1 pt-2"></div>
            <button onclick="cerrarModal('modalBitacora')" class="w-full bg-gray-100 py-4 rounded-2xl font-black mt-4 text-gray-600 text-sm uppercase">Cerrar</button>
        </div>
    </div>

    <div id="modalVentaLibre" class="fixed inset-0 modal-bg hidden items-center justify-center z-50 p-4">
        <div class="bg-white w-full max-w-sm rounded-[35px] shadow-2xl flex flex-col max-h-[85vh]">
            <div class="p-8 pb-2 text-center border-b"><h3 class="text-2xl font-black text-gray-800">Venta Especial</h3></div>
            <div id="contenedorContadores" class="flex-1 overflow-y-auto p-8 space-y-2 scroll-beauty"></div>
            <div class="p-8 pt-4 border-t bg-gray-50 rounded-b-[35px]">
                <input id="libMonto" type="number" placeholder="Precio $" class="w-full p-5 bg-white text-blue-600 font-black rounded-2xl border-0 shadow-inner text-center text-3xl mb-4">
                <button onclick="confirmarVentaLibre()" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-black btn-press shadow-lg text-lg">Confirmar</button>
                <button onclick="cerrarModal('modalVentaLibre')" class="w-full py-4 text-red-600 font-black mt-1 uppercase text-xs text-center">CANCELAR</button>
            </div>
        </div>
    </div>

    <div id="modalHistorialDias" class="fixed inset-0 modal-bg hidden items-center justify-center z-50 p-4 text-center">
        <div class="bg-white w-full max-w-sm rounded-[30px] p-8 h-[70vh] flex flex-col shadow-2xl text-center">
            <h3 class="text-2xl font-black mb-6 text-gray-800">Días Pasados</h3>
            <div id="listaDias" class="flex-1 overflow-y-auto space-y-3 scroll-beauty"></div>
            <button onclick="cerrarModal('modalHistorialDias')" class="w-full bg-gray-100 py-4 rounded-2xl font-black mt-4 text-gray-600 text-sm">Cerrar</button>
        </div>
    </div>

    <div id="modalPago" class="fixed inset-0 modal-bg hidden items-end justify-center z-50 text-center">
        <div class="bg-white w-full max-w-md rounded-t-[40px] p-10">
            <h3 class="text-2xl font-black mb-8 text-gray-800 tracking-tight">Forma de Pago</h3>
            <div class="space-y-4">
                <button onclick="finalizar('Efectivo')" class="w-full py-6 bg-gray-50 rounded-2xl font-black text-xl text-left px-12 border-l-8 border-green-500">💵 Efectivo</button>
                <button onclick="finalizar('Terminal')" class="w-full py-6 bg-gray-50 rounded-2xl font-black text-xl text-left px-12 text-blue-600 border-l-8 border-blue-500">💳 Terminal</button>
                <button onclick="finalizar('Transferencia')" class="w-full py-6 bg-gray-50 rounded-2xl font-black text-xl text-left px-12 border-l-8 border-purple-500 text-purple-700 font-black">🏦 Transferencia</button>
                <button onclick="cerrarModal('modalPago')" class="w-full py-4 text-red-500 font-black mt-2 uppercase text-sm">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURACIÓN DE NUBE ---
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw-QAsPe0cOLNJFIogBrfQKXmh40Nf79aX0UuXSLSKdt7Na65ufF74slRGG7emNdNY3/exec"; // <--- PEGA TU LINK AQUÍ
        
        const tipos = ['V4','C4','V6','C6','V8','C8','V16','C16','V32','C32'];
        const nombresMap = {'V':'Vainilla','C':'Chocolate','4':'4oz','6':'6oz','8':'8oz','16':'16oz','32':'32oz'};
        
        let carrito = []; let pagActual = 0; let descuentoPct = 0;
        let seleccionLibre = {}; let recetaPromoNueva = {};
        tipos.forEach(t => { seleccionLibre[t] = 0; recetaPromoNueva[t] = 0; });

        // Intentar cargar localmente primero para rapidez
        let db = JSON.parse(localStorage.getItem('heladeria_v8_final')) || {
            inv: {}, promo: {}, term: {}, tran: {}, dinero: { efec:0, term:0, tran:0 }, bitacora: [], promosConfig: [], reportesPasados: []
        };
        tipos.forEach(t => { if(db.inv[t]===undefined) db.inv[t]=0; if(db.promo[t]===undefined) db.promo[t]=0; if(db.term[t]===undefined) db.term[t]=0; if(db.tran[t]===undefined) db.tran[t]=0; });

        // --- LÓGICA DE SINCRONIZACIÓN ---
        async function cargarDesdeNube() {
            const status = document.getElementById('status-cloud');
            status.innerText = "Sincronizando...";
            status.classList.replace('text-blue-500', 'text-orange-500');
            
            try {
                const resp = await fetch(WEB_APP_URL);
                const dataNube = await resp.json();
                
                if (dataNube && dataNube.bitacora) {
                    db = dataNube;
                    localStorage.setItem('heladeria_v8_final', JSON.stringify(db));
                    status.innerText = "Nube Actualizada";
                    status.classList.replace('text-orange-500', 'text-green-500');
                    renderPromosMain();
                    actualizarUI();
                }
            } catch (e) {
                status.innerText = "Modo Local (Sin red)";
                status.classList.replace('text-orange-500', 'text-red-500');
            }
        }

        function sincronizarConNube() {
            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ tipoAccion: "SYNC", db: db })
            });
        }

        function guardarDB() {
            localStorage.setItem('heladeria_v8_final', JSON.stringify(db));
            sincronizarConNube(); // Envía a la nube cada vez que cambia algo
        }

        // --- FUNCIONES DE LA APP ---
        function renderBotonesPrincipales() {
            const prods = [
                {n:'Vainilla 4oz', id:'V4', p:35, c:'blue-300'}, {n:'Choco 4oz', id:'C4', p:35, c:'orange-700'},
                {n:'Vainilla 6oz', id:'V6', p:50, c:'blue-400'}, {n:'Choco 6oz', id:'C6', p:50, c:'orange-800'},
                {n:'Vainilla 8oz', id:'V8', p:60, c:'blue-500'}, {n:'Choco 8oz', id:'C8', p:60, c:'orange-900'},
                {n:'Vainilla 16oz', id:'V16', p:110, c:'blue-600'}, {n:'Choco 16oz', id:'C16', p:130, c:'orange-950'},
                {n:'Vainilla 32oz', id:'V32', p:200, c:'blue-800'}, {n:'Choco 32oz', id:'C32', p:230, c:'black'}
            ];
            document.getElementById('gridMainProductos').innerHTML = prods.map(p => `
                <button onclick="add('${p.id}', ${p.p})" class="apple-card p-4 btn-press text-left border-l-8 border-${p.c}">
                    <div class="text-${p.c} font-black text-[9px] uppercase">${p.n}</div>
                    <div class="text-xl font-black text-gray-800">$${p.p}</div>
                </button>
            `).join('');
        }

        function add(tipo, precio, receta = null) {
            const pVal = Number(precio);
            if(isNaN(pVal)) return alert("Error de precio");
            carrito.push({ tipo, precio: pVal, receta });
            actualizarUI();
        }
        
        function actualizarUI() {
            let base = 0;
            carrito.forEach(item => { base += item.precio; });
            let total = base - (base * descuentoPct / 100);
            document.getElementById('displayTotal').innerText = `$${total.toFixed(2)}`;
            document.getElementById('displayLista').innerText = (carrito.length > 0 ? carrito.map(i => i.tipo).join(' + ') : "Esperando productos...");
        }

        function finalizar(metodo) {
            let base = 0;
            carrito.forEach(item => { base += item.precio; });
            let totalV = base - (base * descuentoPct / 100);
            
            if(metodo === 'Efectivo') db.dinero.efec += totalV; 
            else if(metodo === 'Terminal') db.dinero.term += totalV; 
            else db.dinero.tran += totalV;

            let itemsCopia = JSON.parse(JSON.stringify(carrito));

            carrito.forEach(item => {
                if(db.inv.hasOwnProperty(item.tipo)) { 
                    db.inv[item.tipo]++; 
                    if(metodo==='Terminal') db.term[item.tipo]++; 
                    if(metodo==='Transferencia') db.tran[item.tipo]++; 
                }
                if(item.receta) { 
                    for(let h in item.receta) { 
                        let cant = item.receta[h]; db.inv[h]+=cant; db.promo[h]+=cant; 
                        if(metodo==='Terminal') db.term[h]+=cant; 
                        if(metodo==='Transferencia') db.tran[h]+=cant; 
                    } 
                }
            });
            db.bitacora.push({ 
                hora: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), 
                monto: totalV, metodo, detalle: carrito.map(i=>i.tipo).join(','), items: itemsCopia 
            });
            guardarDB(); carrito = []; descuentoPct = 0; actualizarUI(); cerrarModal('modalPago');
        }

        function borrarVenta(idx) {
            if(!confirm("¿Borrar venta?")) return;
            const v = db.bitacora[idx];
            if(v.metodo === 'Efectivo') db.dinero.efec -= v.monto; 
            else if(v.metodo === 'Terminal') db.dinero.term -= v.monto; 
            else db.dinero.tran -= v.monto;
            v.items.forEach(item => {
                if(db.inv.hasOwnProperty(item.tipo)) {
                    db.inv[item.tipo]--;
                    if(v.metodo==='Terminal') db.term[item.tipo]--;
                    if(v.metodo==='Transferencia') db.tran[item.tipo]--;
                }
                if(item.receta) {
                    for(let h in item.receta) {
                        let c = item.receta[h]; db.inv[h]-=c; db.promo[h]-=c;
                        if(v.metodo==='Terminal') db.term[h]-=c;
                        if(v.metodo==='Transferencia') db.tran[h]-=c;
                    }
                }
            });
            db.bitacora.splice(idx, 1);
            guardarDB(); abrirBitacora();
        }

        function renderResumen() {
            const cont = document.getElementById('resumenContent');
            document.getElementById('pagiLabel').innerText = "Pág " + (pagActual + 1) + " / 5";
            let h = "";
            if(pagActual === 0) { h = "<h4 class='font-black text-blue-500 mb-4 uppercase text-[10px] tracking-widest'>Inventario</h4><div class='grid grid-cols-2 gap-2'>"; tipos.forEach(t => { h += `<div class="bg-gray-50 p-2 rounded-xl inv-item"><b>${t}:</b> ${db.inv[t] || 0}</div>`; }); h += "</div>"; }
            else if(pagActual === 1) { h = "<h4 class='font-black text-purple-500 mb-4 uppercase text-[10px] tracking-widest'>Promos</h4><div class='grid grid-cols-2 gap-2'>"; tipos.forEach(t => { h += `<div class="bg-purple-50 p-2 rounded-xl inv-item text-purple-900"><b>P-${t}:</b> ${db.promo[t] || 0}</div>`; }); h += "</div>"; }
            else if(pagActual === 2) { h = "<h4 class='font-black text-orange-500 mb-4 uppercase text-[10px] tracking-widest'>Pagos</h4><div class='space-y-2'>"; tipos.forEach(t => { if(db.inv[t]>0) h += `<div class="bg-white border p-2 rounded-lg text-[10px] flex justify-between px-3 font-bold"><b>${t}</b><span>Ef: ${(db.inv[t]-db.term[t]-db.tran[t])} | Tr: ${db.tran[t]} | Te: ${db.term[t]}</span></div>`; }); h += "</div>"; }
            else if(pagActual === 3) { h = `<div class='py-10'><h4 class='font-black text-green-500 mb-6 uppercase text-[10px] tracking-widest'>Bruto</h4><p class='text-3xl font-black mb-2 text-gray-800'>Efec: <b class='text-green-600'>$${db.dinero.efec.toFixed(2)}</b></p><p class='text-3xl font-black text-gray-800'>Term: <b class='text-blue-600'>$${db.dinero.term.toFixed(2)}</b></p></div>`; }
            else { let neto = (db.dinero.efec + db.dinero.term + db.dinero.tran - (db.dinero.term * 0.04176)); h = `<div class='py-10'><h4 class='font-black text-red-500 mb-6 uppercase text-[10px] tracking-widest'>Neto (-Comisión)</h4><p class='text-6xl font-black text-green-600'>$${neto.toFixed(2)}</p></div>`; }
            cont.innerHTML = h;
        }

        function renderContadores() {
            const cL = document.getElementById('contenedorContadores'); const cP = document.getElementById('contadoresPromo');
            cL.innerHTML = ""; cP.innerHTML = "";
            tipos.forEach(t => {
                cL.innerHTML += `<div class="flex items-center justify-between bg-gray-50 p-3 rounded-xl"><span class="font-black text-gray-700">${t}</span><div class="flex items-center gap-4"><button onclick="cambiarLibre('${t}', -1)" class="counter-btn">-</button><span id="libCount${t}" class="font-black">0</span><button onclick="cambiarLibre('${t}', 1)" class="counter-btn text-blue-500">+</button></div></div>`;
                cP.innerHTML += `<div class="bg-white p-2 rounded-xl border flex items-center justify-between"><span class="text-[11px] font-black uppercase px-1">${t}</span><div class="flex items-center gap-2"><button onclick="cambiarRecetaPromo('${t}',-1)" class="text-gray-400 font-bold px-1"> - </button><span id="receta${t}" class="text-xs font-black text-blue-600">0</span><button onclick="cambiarRecetaPromo('${t}',1)" class="text-blue-500 font-bold px-1"> + </button></div></div>`;
            });
        }

        function cerrarModal(id) { document.getElementById(id).style.display = 'none'; }
        function cambiarPagina(d) { pagActual = Math.max(0, Math.min(4, pagActual + d)); renderResumen(); }
        function abrirResumen() { pagActual = 0; document.getElementById('modalResumen').style.display = 'flex'; renderResumen(); }
        function abrirAjustes() { document.getElementById('modalAjustes').style.display = 'flex'; renderListaGestion(); renderContadores(); }
        function abrirVentaLibre() { renderContadores(); tipos.forEach(t => { seleccionLibre[t]=0; if(document.getElementById('libCount'+t)) document.getElementById('libCount'+t).innerText=0; }); document.getElementById('libMonto').value=""; document.getElementById('modalVentaLibre').style.display='flex'; }
        function cambiarLibre(t, c) { seleccionLibre[t] = Math.max(0, seleccionLibre[t] + c); if(document.getElementById('libCount'+t)) document.getElementById('libCount'+t).innerText = seleccionLibre[t]; }
        function cambiarRecetaPromo(t, c) { recetaPromoNueva[t] = Math.max(0, recetaPromoNueva[t] + c); if(document.getElementById('receta'+t)) document.getElementById('receta'+t).innerText = recetaPromoNueva[t]; }
        function confirmarVentaLibre() { const m = parseFloat(document.getElementById('libMonto').value); if(!m) return; add("Especial", m, {...seleccionLibre}); cerrarModal('modalVentaLibre'); }
        function aplicarDescuento(p) { descuentoPct = p; actualizarUI(); }
        function borrarUltimo() { carrito.pop(); actualizarUI(); }
        function abrirBitacora() { document.getElementById('modalBitacora').style.display = 'flex'; const cont = document.getElementById('listaBitacora'); cont.innerHTML = ""; [...db.bitacora].reverse().forEach((v, index) => { const realIdx = db.bitacora.length - 1 - index; cont.innerHTML += `<div class="apple-card p-4 border-l-8 border-blue-500 mb-2 text-sm flex justify-between items-center text-left"><div><b>${v.hora} - $${v.monto.toFixed(2)}</b> (${v.metodo})<br><small class="text-gray-400 font-bold">${v.detalle}</small></div><button onclick="borrarVenta(${realIdx})" class="bg-red-50 text-red-600 px-3 py-2 rounded-xl font-black text-[10px]">BORRAR</button></div>`; }); }
        function abrirHistorialDias() { document.getElementById('modalHistorialDias').style.display = 'flex'; const cont = document.getElementById('listaDias'); cont.innerHTML = ""; db.reportesPasados.slice().reverse().forEach(r => { cont.innerHTML += `<div class="bg-gray-100 p-4 rounded-xl mb-1 text-xs text-left font-bold"><b>${r.fecha}</b> - Neto: $${r.total.toFixed(2)}</div>`; }); }
        function abrirPago() { if(carrito.length > 0) document.getElementById('modalPago').style.display = 'flex'; }
        function guardarNuevaPromo() { let n = document.getElementById('pNom').value; let p = Number(document.getElementById('pPre').value); if(n && p) { db.promosConfig.push({ nombre: n, precio: p, receta: {...recetaPromoNueva} }); tipos.forEach(t => recetaPromoNueva[t] = 0); guardarDB(); renderPromosMain(); renderContadores(); document.getElementById('pNom').value = ""; document.getElementById('pPre').value = ""; } }
        function renderPromosMain() { const g = document.getElementById('gridPromos'); g.innerHTML = ""; db.promosConfig.forEach((p, idx) => { g.innerHTML += `<button onclick="add('${p.nombre}', ${p.precio}, ${JSON.stringify(p.receta).replace(/"/g, '&quot;')})" class="apple-card p-5 flex justify-between items-center btn-press border-l-8 border-blue-600"><span class="font-black text-sm text-gray-700">${p.nombre}</span><b class="text-blue-600 text-xl font-black">$${p.precio.toFixed(2)}</b></button>`; }); }
        function renderListaGestion() { const l = document.getElementById('listaPromosGestion'); l.innerHTML = ""; db.promosConfig.forEach((p, i) => { l.innerHTML += `<div class="flex justify-between items-center bg-gray-50 p-3 rounded-xl mb-1 text-xs font-bold text-gray-600"><span>${p.nombre} ($${p.precio})</span><button onclick="db.promosConfig.splice(${i},1);guardarDB();renderPromosMain();abrirAjustes();" class="text-red-500 font-black px-2 text-lg">×</button></div>`; }); }
        
        function abrirConfirmReset() {
            if(confirm("¿Cerrar caja y enviar a Google?")) {
                const hoy = new Date().toLocaleDateString();
                let neto = (db.dinero.efec + db.dinero.term + db.dinero.tran - (db.dinero.term * 0.04176));
                db.reportesPasados.push({ fecha: hoy, total: neto });
                
                // Limpieza de contadores
                tipos.forEach(t => { db.inv[t]=0; db.promo[t]=0; db.term[t]=0; db.tran[t]=0; });
                db.dinero = { efec:0, term:0, tran:0 };
                db.bitacora = [];
                
                // Sincronizar cierre
                guardarDB();
                alert("Caja Cerrada. La página se refrescará.");
                location.reload();
            }
        }

        // --- INICIO AL CARGAR ---
        window.onload = () => {
            renderBotonesPrincipales();
            renderPromosMain();
            cargarDesdeNube(); // Intentar cargar lo más nuevo al abrir
        };
    </script>
</body>
</html>
